name: RepoRadar
options:
  bundleIdPrefix: com.rossnicholson
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

packages:
  HouseStyle:
    url: https://github.com/RossNicholson/mac-house-style
    from: 1.2.0

targets:
  RepoRadar:
    type: application
    platform: macOS
    sources:
      - path: RepoRadar
    dependencies:
      - package: HouseStyle
    info:
      path: RepoRadar/Info.plist
      properties:
        CFBundleName: Repo Radar
        CFBundleDisplayName: Repo Radar
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "3"
        LSUIElement: true
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Ross Nicholson. MIT licence."
    settings:
      base:
        PRODUCT_NAME: RepoRadar
        PRODUCT_BUNDLE_IDENTIFIER: com.rossnicholson.RepoRadar
        CODE_SIGN_ENTITLEMENTS: RepoRadar/RepoRadar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: "5HQ5V9NP82"
          ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - RepoRadarTests

  RepoRadarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RepoRadarTests
    dependencies:
      - target: RepoRadar
